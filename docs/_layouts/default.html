<!doctype html>
<html lang="{{ site.lang | default: 'es' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.layout != 'home' %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_html | truncate: 160 }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
{% if page.imagen %}<meta property="og:image" content="{{ page.imagen }}">{% endif %}
<meta name="theme-color" content="#0f1115">
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23FFD400'/><text x='50' y='70' font-size='62' font-family='Arial Black,Arial' font-weight='900' text-anchor='middle' fill='%230f1115'>A</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/estilo.css' | relative_url }}">
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <a class="logo" href="{{ '/' | relative_url }}"><span class="logo-a">A</span><span>El Atajo</span></a>
    <nav>
      <a href="{{ '/acerca/' | relative_url }}">Acerca de</a>
      <a class="btn-yt" href="{{ site.youtube }}" target="_blank" rel="noopener">▶ YouTube</a>
    </nav>
  </div>
</header>
<main>{{ content }}</main>
<footer class="pie">
  <div class="wrap">
    <p><strong>El Atajo</strong> · {{ site.description }}</p>
    <p><a href="{{ site.youtube }}" target="_blank" rel="noopener">Canal de YouTube</a> · <a href="{{ '/acerca/' | relative_url }}">Acerca de</a> · <a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
    <p class="nota">Algunos enlaces son de afiliado: si compras a través de ellos, el proyecto gana una pequeña comisión sin costo extra para ti.</p>
  </div>
</footer>
</body>
</html>
