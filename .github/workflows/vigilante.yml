name: Vigilante del servidor
# Revisa cada 15 minutos que tu n8n (Oracle) esté vivo.
# Si deja de responder te avisa por Telegram (una sola vez), y otra vez cuando vuelve.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Revisar servidor
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          URL: https://147-224-171-235.sslip.io/healthz
        run: |
          avisar() {
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT}" --data-urlencode text="$1" > /dev/null
          }
          # Cómo terminó la revisión anterior (success = servidor estaba bien)
          ANTES=$(gh run list -R "$GITHUB_REPOSITORY" -w vigilante.yml -s completed -L 1 --json conclusion -q '.[0].conclusion' 2>/dev/null || echo success)
          OK=0
          for i in 1 2 3; do
            if curl -sf --max-time 20 "$URL" > /dev/null; then OK=1; break; fi
            sleep 20
          done
          if [ "$OK" = 1 ]; then
            echo "Servidor OK"
            [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && avisar "🧪 Vigilante conectado: tu servidor AUTONOMON está funcionando ✅"
            [ "$ANTES" = "failure" ] && avisar "✅ Tu servidor AUTONOMON volvió a funcionar."
            exit 0
          fi
          echo "Servidor CAIDO"
          [ "$ANTES" != "failure" ] && avisar "🚨 Tu servidor AUTONOMON no responde (n8n en Oracle). Escríbeme y lo reviso."
          exit 1

  latido:
    # GitHub apaga los horarios si el repo pasa 60 días sin cambios: una vez al mes deja una marca.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Latido mensual
        run: |
          MES=$(date -u +%Y-%m)
          if [ "$(cat .latido 2>/dev/null)" != "$MES" ]; then
            echo "$MES" > .latido
            git config user.name "vigilante"
            git config user.email "vigilante@users.noreply.github.com"
            git add .latido && git commit -m "latido $MES" && git push || true
          fi
